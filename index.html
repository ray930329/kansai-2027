<style>
/* Layout: one long phone-first scroll — night-sky hero with countdown, sticky pill nav, then stacked sections (flights, weather, spots, food, stays, daily accordion, wishlist, tips) */
:root {
  --bg: #EEF4F8;
  --surface: #FFFFFF;
  --surface-2: #F3F8FB;
  --ink: #16324A;
  --muted: #5C7285;
  --line: #DCE6EE;
  --primary: #1E5F8E;
  --primary-soft: #E3F0F8;
  --on-primary: #FFFFFF;
  --accent: #E0662C;
  --warn-bg: #FFF4DA;
  --warn-ink: #7A5200;
  --danger: #B3261E;
  --shadow: 0 6px 18px rgba(22, 50, 74, .08);
  --d1: #C9651A; --d2: #B8336A; --d3: #8F6E12; --d4: #3A7537; --d5: #C2352B; --d6: #6449AE; --d7: #3B5A74;
  --hero-ink: #FFFFFF;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --f-latin: "Nunito", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161E; --surface: #16212C; --surface-2: #1C2935; --ink: #E4EEF6; --muted: #96A9BA; --line: #263544;
    --primary: #7DB8E4; --primary-soft: #1B3347; --on-primary: #0E161E; --accent: #F29A66;
    --warn-bg: #3A2F14; --warn-ink: #F3CF7A; --danger: #F08378; --shadow: 0 6px 18px rgba(0, 0, 0, .25);
    --d1: #F0974F; --d2: #E57CA4; --d3: #D6B451; --d4: #82BA77; --d5: #EF7266; --d6: #A894EA; --d7: #8EAECB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161E; --surface: #16212C; --surface-2: #1C2935; --ink: #E4EEF6; --muted: #96A9BA; --line: #263544;
  --primary: #7DB8E4; --primary-soft: #1B3347; --on-primary: #0E161E; --accent: #F29A66;
  --warn-bg: #3A2F14; --warn-ink: #F3CF7A; --danger: #F08378; --shadow: 0 6px 18px rgba(0, 0, 0, .25);
  --d1: #F0974F; --d2: #E57CA4; --d3: #D6B451; --d4: #82BA77; --d5: #EF7266; --d6: #A894EA; --d7: #8EAECB;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }

/* hero */
.hero { position: relative; margin-inline: -16px; color: var(--hero-ink); overflow: hidden;
  background: linear-gradient(180deg, #14213D 0%, #2B3F6B 45%, #6F6E9A 78%, #C9939A 100%); }
.hero svg.scene { position: absolute; inset: auto 0 0 0; width: 100%; height: 72%; }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .55; pointer-events: none;
  background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 70% 20%, #fff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 40% 60%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 85% 55%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 10% 75%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 55% 40%, #fff 50%, transparent 51%);
  background-size: 160px 160px; }
.hero-inner { position: relative; display: grid; justify-items: center; gap: 10px; text-align: center; padding: 44px 16px 64px; }
.hero .badge { font-size: 34px; line-height: 1; }
.hero h1 { font-family: var(--f-latin); font-weight: 800; font-size: clamp(30px, 8.5vw, 42px); letter-spacing: .02em; margin: 0; line-height: 1.1;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .35); text-wrap: balance; }
.hero .sub { font-family: var(--f-latin); font-size: 15px; letter-spacing: .08em; opacity: .9; }
.countdown { background: rgba(255, 255, 255, .92); color: #16324A; border-radius: 18px; padding: 12px 22px; display: grid; gap: 2px; margin-top: 6px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .18); min-width: min(300px, 100%); }
.countdown .lbl { font-size: 13px; color: #1E5F8E; font-weight: 700; letter-spacing: .04em; }
.countdown .num { font-size: 20px; font-weight: 900; color: #1E5F8E; font-variant-numeric: tabular-nums; }
.countdown .num .s { color: #E0662C; }
.hero-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.hero-chip { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; padding: 3px 12px; font-size: 13px; backdrop-filter: blur(4px); }
.wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 34px; display: block; }
.wave path { fill: var(--bg); }

/* sticky nav */
nav.pills { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; margin-inline: -16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); scrollbar-width: none; }
nav.pills::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
.pill.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 700; }

section.sec { padding-top: 26px; display: grid; gap: 14px; scroll-margin-top: calc(56px + env(safe-area-inset-top, 0px)); }
h2.sec-title { font-size: 23px; font-weight: 900; color: var(--primary); margin: 0; display: flex; gap: 8px; align-items: center; text-wrap: balance; }
.sec-note { font-size: 13px; color: var(--muted); margin: -6px 0 0; }

.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.muted { color: var(--muted); }
.note { color: var(--muted); margin: 0; overflow-wrap: anywhere; white-space: pre-line; font-size: 14px; }
.tag { justify-self: start; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.btn { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn.map { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.add { justify-content: center; padding: 9px; border-style: dashed; background: transparent; color: var(--muted); font-size: 14px; border-radius: 14px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 2px 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

/* flights */
.flight { border-left: 5px solid var(--fc, var(--primary)); }
.flight .kind { font-size: 13px; font-weight: 700; color: var(--fc, var(--primary)); }
.flight .no { font-size: 19px; font-weight: 900; }
.flight .route { font-size: 14px; color: var(--muted); }
.flight .times { font-family: var(--f-latin); font-size: 26px; font-weight: 800; color: var(--good, var(--primary)); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.arrive-box { background: var(--primary-soft); border-radius: 12px; padding: 9px 12px; display: grid; gap: 2px; }

/* weather */
.climate { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.climate .city { font-weight: 900; font-size: 17px; }
.temps { font-family: var(--f-latin); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.temps .lo { color: var(--primary); } .temps .hi { color: var(--accent); }
.days-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 12px; }
.days-strip div { display: grid; gap: 0; padding: 6px 0; border-radius: 10px; }
.days-strip b { font-size: 13px; }
.days-strip .kyo { background: var(--primary-soft); }
.days-strip .osa { background: var(--warn-bg); color: var(--warn-ink); }

/* horizontal cards */
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: min(72%, 250px); gap: 12px; overflow-x: auto; padding: 4px 16px 12px; margin-inline: -16px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; }
.hcard { scroll-snap-align: start; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.cover { height: 104px; display: grid; place-items: center; font-size: 44px; position: relative;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 85%, #fff 0%), color-mix(in srgb, var(--c) 45%, var(--surface))); }
.cover .day { position: absolute; left: 10px; top: 10px; font-family: var(--f-latin); font-size: 12px; font-weight: 800; background: rgba(255, 255, 255, .9); color: #16324A; border-radius: 999px; padding: 1px 9px; }
.hbody { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
.hbody .name { font-weight: 900; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
.hbody .note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* hotels */
.stay .cover { height: 120px; font-size: 52px; }
.stay-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.stay .name { font-weight: 900; font-size: 18px; overflow-wrap: anywhere; }
.when { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* daily accordion */
details.day { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
details.day > summary { list-style: none; cursor: pointer; padding: 15px 16px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
details.day > summary::-webkit-details-marker { display: none; }
details.day > summary .t { flex: 1; min-width: 0; }
details.day > summary .t b { color: var(--c); font-family: var(--f-latin); font-weight: 800; }
details.day > summary .tri { color: var(--primary); font-size: 12px; transition: transform .2s; }
details.day[open] > summary .tri { transform: rotate(90deg); }
.day-body { padding: 0 16px 16px; display: grid; gap: 12px; }
ol.tl { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 14px; }
ol.tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: color-mix(in srgb, var(--c) 45%, var(--line)); }
.tl-item { position: relative; padding-left: 28px; display: grid; gap: 3px; min-width: 0; }
.tl-item::before { content: ""; position: absolute; left: 0; top: 6px; width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); box-sizing: border-box; }
.tl-item .head { font-weight: 700; color: var(--c); overflow-wrap: anywhere; }
.tl-item .head .k { margin-right: 4px; }
.group { display: inline-block; font-size: 12px; background: var(--c); color: var(--surface); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 8px 12px; font-size: 13px; }
.edit-bar { display: flex; justify-content: flex-end; }

/* forms */
form.edit { display: grid; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); }
input, select, textarea { font: inherit; width: 100%; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
textarea { min-height: 64px; resize: vertical; }

/* wishlist + tips */
.wish-list { display: grid; gap: 10px; }
.vote.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.promote select { width: auto; padding: 3px 8px; font-size: 13px; border-radius: 999px; }
details.tips { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); }
details.tips > summary { list-style: none; cursor: pointer; padding: 15px 16px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
details.tips > summary::-webkit-details-marker { display: none; }
details.tips[open] > summary .tri { transform: rotate(90deg); }
details.tips > summary .tri { color: var(--primary); font-size: 12px; transition: transform .2s; }
.tips-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input[type="checkbox"] { width: 20px; height: 20px; margin: 3px 0 0; padding: 0; flex: 0 0 auto; accent-color: var(--primary); }
.check .txt { flex: 1; min-width: 0; display: grid; }
.check .t1 { font-weight: 700; }
.check.done .t1 { text-decoration: line-through; color: var(--muted); }
.progress { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--primary); }

.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 16px; color: var(--muted); text-align: center; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); z-index: 10;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; }
.foot { font-size: 13px; color: var(--muted); text-align: center; padding-top: 30px; }
</style>

<div class="wrap">
  <header class="hero" id="top">
    <svg class="scene" id="scene" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="hero-inner">

      <div class="hero-chips"><span class="hero-chip">👥 3 人</span><span class="hero-chip">🌙 7 天 6 夜</span><span class="hero-chip">🚃 電車旅行</span></div>
    </div>

    <button class="pill" data-go="stay">🏨 住宿</button>

  <main id="main"><div class="empty" style="margin-top:24px">正在載入行程…</div></main>

</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const DAYS = [
  { n: 1, date: "01/12", dow: "二", icon: "🛬", title: "抵達京都・伏見稻荷", city: "kyo" },
  { n: 2, date: "01/13", dow: "三", icon: "⛩️", title: "清水寺・祇園・下鴨神社", city: "kyo" },
  { n: 3, date: "01/14", dow: "四", icon: "🏯", title: "金閣寺・貴船神社", city: "kyo" },
  { n: 4, date: "01/15", dow: "五", icon: "🍵", title: "宇治 → 大阪・晚上分組", city: "osa" },
  { n: 5, date: "01/16", dow: "六", icon: "🛍️", title: "大阪休息日・難波心齋橋", city: "osa" },
  { n: 6, date: "01/17", dow: "日", icon: "🎎", title: "勝尾寺・梅田逛街", city: "osa" },
  { n: 7, date: "01/18", dow: "一", icon: "✈️", title: "回台灣", city: "osa" },
];
const KINDS = ["景點", "美食", "購物", "交通", "住宿", "其他"];
const KIND_ICON = { "景點": "📍", "美食": "🍜", "購物": "🛍️", "交通": "🚃", "住宿": "🏨", "其他": "✨" };
const WD = "日一二三四五六";
const DEPART = new Date("2027-01-12T09:20:00+08:00");
const RETURN = new Date("2027-01-18T16:20:00+08:00");

const FLIGHT_SPECS = [
  { n: "label", l: "標籤(去程/回程)" }, { n: "flightNo", l: "航班號碼" }, { n: "airline", l: "航空公司" }, { n: "date", l: "日期(2027-01-12)" },
  { n: "depCode", l: "出發機場代碼" }, { n: "depCity", l: "出發城市" }, { n: "depTerm", l: "出發航廈" }, { n: "depTime", l: "起飛時間(09:20)" },
  { n: "arrCode", l: "抵達機場代碼" }, { n: "arrCity", l: "抵達城市" }, { n: "arrTerm", l: "抵達航廈" }, { n: "arrTime", l: "抵達時間" },
  { n: "baggage", l: "行李額度" }, { n: "leadMin", l: "提早幾分鐘到機場", type: "number" }, { n: "note", l: "交通與備註", type: "textarea" },
];
const HOTEL_SPECS = [
  { n: "city", l: "城市" }, { n: "name", l: "住宿名稱" }, { n: "checkIn", l: "入住日(2027-01-12)" }, { n: "checkOut", l: "退房日" },
  { n: "map", l: "Google 地圖搜尋字或連結", wide: true }, { n: "note", l: "備註", type: "textarea" },
];
const PREP_SPECS = [{ n: "text", l: "待辦事項", wide: true }, { n: "note", l: "說明", type: "textarea" }];

const S = {
  db: null, user: null, myId: null, writable: true, ready: false, noDb: false,
  items: [], wishes: [], flights: [], hotels: [], prep: [], checks: {}, names: {},
  open: new Set(), editDays: new Set(), tipsOpen: false,
  editing: null, draft: {}, armed: null, pendingRender: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mapUrl = (q) => /^https?:\/\//i.test(q) ? q : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const itemsOf = (n) => S.items.filter((i) => i.day === n).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const maxOrder = (n) => itemsOf(n).reduce((m, i) => Math.max(m, i.order ?? 0), 0);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
const canWrite = () => !!S.db && S.writable;
const who = (id) => S.names[id] || "旅伴";
const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || "").trim()); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const fmtMin = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const parseDate = (d) => { const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(d || "").trim()); return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null; };
const fmtDate = (d) => { const dt = parseDate(d); return dt ? `${dt.getMonth() + 1}/${dt.getDate()}(${WD[dt.getDay()]})` : esc(d || "日期未定"); };
const nightsOf = (a, b) => { const x = parseDate(a), y = parseDate(b); return x && y ? Math.round((y - x) / 86400000) : null; };

/* ---------- hero scene ---------- */
(function scene() {
  let s = `<circle cx="78" cy="58" r="15" fill="#F6E7C8" opacity=".9"/>
    <polygon points="0,168 55,122 110,158 180,104 250,150 315,112 400,158 400,220 0,220" fill="#ffffff" opacity=".08"/>
    <polygon points="0,192 70,154 140,186 220,146 290,182 350,152 400,176 400,220 0,220" fill="#0A1428" opacity=".35"/>`;
  const cx = 318, base = 204, ink = "#0A1428";
  for (let i = 0; i < 5; i++) {
    const w = 72 - i * 10, y = base - i * 22;
    s += `<polygon points="${cx - w / 2},${y} ${cx + w / 2},${y} ${cx + w / 2 - 9},${y - 6} ${cx - w / 2 + 9},${y - 6}" fill="${ink}" opacity=".85"/>`;
    s += `<rect x="${cx - w * 0.26}" y="${y - 22}" width="${w * 0.52}" height="16" fill="${ink}" opacity=".85"/>`;
  }
  s += `<rect x="${cx - 1.5}" y="${base - 5 * 22 - 26}" width="3" height="28" fill="${ink}" opacity=".85"/>`;
  s += `<rect x="0" y="${base}" width="400" height="20" fill="${ink}" opacity=".55"/>`;
  $("scene").innerHTML = s;
})();

/* ---------- countdown ---------- */
function tick() {
  const now = new Date();
  if (now < DEPART) {
    let t = Math.floor((DEPART - now) / 1000);
    const d = Math.floor(t / 86400); t %= 86400;
    const h = Math.floor(t / 3600); t %= 3600;
    const m = Math.floor(t / 60), s = t % 60;
    $("cd-lbl").textContent = "關西出發倒數";
    $("cd").innerHTML = `${d}天 ${h}小時 ${m}分 <span class="s">${s}秒</span>`;
  } else if (now < RETURN) {
    const day = Math.floor((now - new Date("2027-01-12T00:00:00+09:00")) / 86400000) + 1;
    $("cd-lbl").textContent = "旅途中";
    $("cd").textContent = `Day ${Math.min(Math.max(day, 1), 7)} ・ 玩得開心`;
  } else {
    $("cd-lbl").textContent = "旅程結束";
    $("cd").textContent = "歡迎回家 🏠";
  }
}
tick(); setInterval(tick, 1000);

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200);
}
async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.writable = false; toast("你目前只能查看。請行程擁有者在分享選單把你設為編輯者。"); }
    else if (code === "quota_exceeded") toast("儲存空間已滿,刪掉一些項目後再試。");
    else toast("沒有存到,請檢查網路後再試一次。");
    render(); return false;
  }
}
function requestRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest("form.edit")) { S.pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (S.pendingRender) { const a = document.activeElement; if (!(a && a.closest && a.closest("form.edit"))) { S.pendingRender = false; render(); } }
}, 0));

function kindOptions(sel) { return KINDS.map((k) => `<option${k === sel ? " selected" : ""}>${k}</option>`).join(""); }
function dayOptions(sel) { return DAYS.map((d) => `<option value="${d.n}"${d.n === sel ? " selected" : ""}>Day ${d.n}・${d.date}</option>`).join(""); }
function specForm(formId, specs, submitLabel) {
  const f = S.draft;
  const fields = specs.map((s) => {
    const id = "x-" + s.n;
    const ctl = s.type === "textarea" ? `<textarea id="${id}" name="${s.n}">${esc(f[s.n])}</textarea>`
      : `<input id="${id}" name="${s.n}" type="${s.type || "text"}" value="${esc(f[s.n])}">`;
    return `<div class="field${s.type === "textarea" || s.wide ? " wide" : ""}"><label for="${id}">${s.l}</label>${ctl}</div>`;
  }).join("");
  return `<form class="edit" data-form="${formId}"><div class="row">${fields}</div>
    <div class="actions"><button class="btn primary" type="submit">${submitLabel}</button><button class="btn" type="button" data-act="cancel">取消</button></div></form>`;
}
function stopForm(isNew, d) {
  const f = S.draft;
  return `<form class="edit" data-form="${isNew ? "new-item" : "edit-item"}">
    <div class="field"><label for="f-title">地點名稱</label><input id="f-title" name="title" value="${esc(f.title)}" required placeholder="例如:伏見稻荷大社"></div>
    <div class="field"><label for="f-note">說明</label><textarea id="f-note" name="note" placeholder="要注意什麼、吃什麼、怎麼去">${esc(f.note)}</textarea></div>
    <div class="row">
      <div class="field"><label for="f-kind">類型</label><select id="f-kind" name="kind">${kindOptions(f.kind || "景點")}</select></div>
      <div class="field"><label for="f-day">哪一天</label><select id="f-day" name="day">${dayOptions(Number(f.day) || d)}</select></div>
      <div class="field"><label for="f-group">分組(可留空)</label><input id="f-group" name="group" value="${esc(f.group)}" placeholder="例如:A組"></div>
    </div>
    <div class="field"><label for="f-map">Google 地圖搜尋字或連結(留空就用名稱)</label><input id="f-map" name="map" value="${esc(f.map)}"></div>
    <div class="actions"><button class="btn primary" type="submit">${isNew ? "加入行程" : "儲存"}</button><button class="btn" type="button" data-act="cancel">取消</button></div>
  </form>`;
}

/* ---------- sections ---------- */
function flightsSec() {
  const list = [...S.flights].sort(byOrder);
  const cards = list.map((f, i) => {
    if (S.editing === "flight:" + f.id) return specForm("flight", FLIGHT_SPECS, "儲存航班");
    const dep = toMin(f.depTime), lead = Number(f.leadMin) || 150;
    const color = i === 0 ? "var(--accent)" : "var(--d4)";
    return `<div class="card flight" style="--fc:${color}">
      <span class="kind">${i === 0 ? "✈️" : "🛬"} ${esc(f.label || "")}航班 · ${fmtDate(f.date)}</span>
      <span class="no">${esc(f.flightNo || "")} ${esc(f.airline || "")}</span>
      <span class="route">${esc(f.depCity || "")} ${esc(f.depTerm || "")} → ${esc(f.arrCity || "")} ${esc(f.arrTerm || "")}</span>
      <span class="times">${esc(f.depTime || "--:--")} → ${esc(f.arrTime || "--:--")}</span>
      ${dep != null ? `<div class="arrive-box"><span>🕒 <b>${fmtMin(dep - lead)} 前抵達${esc(f.depCity || "")}機場</b></span>
        <ul class="tl-mini"><li><span>${fmtMin(dep - 60)}</span>報到櫃台截止</li><li><span>${fmtMin(dep - 20)}</span>登機門關閉(約)</li></ul></div>` : ""}
      ${f.baggage ? `<span class="tag">🧳 ${esc(f.baggage)}</span>` : ""}
      ${f.note ? `<p class="note">${esc(f.note)}</p>` : ""}
      ${canWrite() ? `<div class="actions"><button class="btn ghost" data-act="fedit" data-id="${f.id}">✏️ 編輯</button></div>` : ""}
    </div>`;
  }).join("");
  return `<section class="sec" id="sec-flight"><h2 class="sec-title">✈️ 航班資訊</h2>
    ${cards || `<div class="empty">還沒有航班資訊。</div>`}
    <p class="sec-note">報到截止和登機門時間依航空公司一般規定估算,以航空公司通知為準。</p></section>`;
}

function weatherSec() {
  const strip = DAYS.map((d) => `<div class="${d.city}"><b>${d.date.replace(/^0/, "")}</b><span>(${d.dow})</span><span>${d.city === "kyo" ? "京都" : "大阪"}</span></div>`).join("");
  return `<section class="sec" id="sec-weather"><h2 class="sec-title">⛅ 一月關西天氣</h2>
    <div class="climate">
      <div class="card"><span class="city">❄️ 京都</span><span class="temps"><span class="lo">1°</span> / <span class="hi">9°</span></span>
        <span class="note">早晚接近 0°C,偶爾會下雪。貴船山上更冷。</span></div>
      <div class="card"><span class="city">🌤️ 大阪</span><span class="temps"><span class="lo">3°</span> / <span class="hi">10°</span></span>
        <span class="note">比京都稍暖,風大時體感很冷。</span></div>
    </div>
    <div class="card"><div class="days-strip">${strip}</div>
      <span class="note">數字是歷年一月平均最低 / 最高溫,不是預報。洋蔥式穿法,帶保暖外套、手套和好走的鞋。</span>
      <div class="actions"><a class="btn" href="https://www.google.com/search?q=%E4%BA%AC%E9%83%BD+%E5%A4%A9%E6%B0%A3" target="_blank" rel="noopener">京都即時天氣 ↗</a>
        <a class="btn" href="https://www.google.com/search?q=%E5%A4%A7%E9%98%AA+%E5%A4%A9%E6%B0%A3" target="_blank" rel="noopener">大阪即時天氣 ↗</a></div></div>
  </section>`;
}

function hcards(list) {
  return list.map((it) => `<article class="hcard" style="--c:var(--d${it.day})">
      <div class="cover"><span class="day">Day ${it.day}</span><span aria-hidden="true">${KIND_ICON[it.kind] || "📍"}</span></div>
      <div class="hbody"><span class="name">${esc(it.title)}</span>
        ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
        <div class="actions"><a class="btn map" href="${esc(mapUrl(it.map || it.title))}" target="_blank" rel="noopener">📍 地圖</a></div></div>
    </article>`).join("");
}
function spotsSec() {
  const list = S.items.filter((i) => i.kind === "景點").sort((a, b) => a.day - b.day || byOrder(a, b));
  return `<section class="sec" id="sec-spots"><h2 class="sec-title">📍 必訪景點</h2>
    ${list.length ? `<div class="hscroll" id="hs-spots">${hcards(list)}</div>` : `<div class="empty">在每日行程裡新增「景點」,就會出現在這裡。</div>`}</section>`;
}
function foodSec() {
  const list = S.items.filter((i) => i.kind === "美食" || i.kind === "購物").sort((a, b) => a.day - b.day || byOrder(a, b));
  return `<section class="sec" id="sec-food"><h2 class="sec-title">🍜 美食與購物</h2>
    ${list.length ? `<div class="hscroll" id="hs-food">${hcards(list)}</div>` : `<div class="empty">在每日行程裡新增「美食」或「購物」,就會出現在這裡。</div>`}</section>`;
}

function staySec() {
  const list = [...S.hotels].sort(byOrder);
  const cards = list.map((h, i) => {
    if (S.editing === "hotel:" + h.id) return specForm("hotel", HOTEL_SPECS, "儲存住宿");
    const n = nightsOf(h.checkIn, h.checkOut);
    return `<article class="hcard stay" style="--c:${i === 0 ? "var(--d2)" : "var(--d7)"}">
      <div class="cover"><span aria-hidden="true">${i === 0 ? "🏮" : "🌃"}</span></div>
      <div class="hbody">
        <div class="stay-head"><span class="tag">${esc(h.city || "")}${n != null ? `・${n} 晚` : ""}</span><span class="when">📅 ${fmtDate(h.checkIn)} – ${fmtDate(h.checkOut)}</span></div>
        <span class="name">${esc(h.name || "")}</span>
        ${h.note ? `<p class="note">${esc(h.note)}</p>` : ""}
        <div class="actions"><a class="btn map" href="${esc(mapUrl(h.map || h.name))}" target="_blank" rel="noopener">📍 地圖</a>
          ${canWrite() ? `<button class="btn ghost" data-act="hedit" data-id="${h.id}">✏️ 編輯</button>` : ""}</div>
      </div></article>`;
  }).join("");
  return `<section class="sec" id="sec-stay"><h2 class="sec-title">🏨 住宿</h2>
    <div style="display:grid;gap:14px">${cards || `<div class="empty">還沒有住宿資訊。</div>`}</div></section>`;
}

function stopRow(it, idx, total, n, editMode) {
  if (S.editing === it.id) return `<li class="tl-item">${stopForm(false, n)}</li>`;
  const armed = S.armed === it.id;
  return `<li class="tl-item">
    <span class="head"><span class="k" aria-hidden="true">${KIND_ICON[it.kind] || "📍"}</span>${esc(it.title)}${it.group ? `<span class="group">${esc(it.group)}</span>` : ""}</span>
    ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
    ${it.addedBy ? `<span class="note" style="font-size:12px">由 ${esc(who(it.addedBy))} 新增</span>` : ""}
    <div class="actions"><a class="btn" href="${esc(mapUrl(it.map || it.title))}" target="_blank" rel="noopener">📍 地圖</a>
      ${editMode ? `<button class="btn" data-act="up" data-id="${it.id}" ${idx === 0 ? "disabled" : ""} aria-label="往前移">↑</button>
        <button class="btn" data-act="down" data-id="${it.id}" ${idx === total - 1 ? "disabled" : ""} aria-label="往後移">↓</button>
        <button class="btn" data-act="edit" data-id="${it.id}">編輯</button>
        <button class="btn danger ${armed ? "armed" : ""}" data-act="del" data-id="${it.id}">${armed ? "再按一次刪除" : "刪除"}</button>` : ""}
    </div></li>`;
}
function daysSec() {
  const blocks = DAYS.map((d) => {
    const list = itemsOf(d.n);
    const editMode = canWrite() && S.editDays.has(d.n);
    const add = !editMode ? "" : S.editing === "new:" + d.n ? stopForm(true, d.n) : `<button class="btn add" data-act="new" data-day="${d.n}">+ 新增地點到 Day ${d.n}</button>`;
    return `<details class="day" data-day="${d.n}" style="--c:var(--d${d.n})" ${S.open.has(d.n) ? "open" : ""}>
      <summary><span aria-hidden="true">${d.icon}</span><span class="t"><b>Day ${d.n}</b>|${d.date.replace(/^0/, "")}(${d.dow}) ${esc(d.title)}</span><span class="tri" aria-hidden="true">▶</span></summary>
      <div class="day-body">
        ${canWrite() ? `<div class="edit-bar"><button class="btn ghost" data-act="editday" data-day="${d.n}">${editMode ? "✓ 完成編輯" : "✏️ 編輯這天"}</button></div>` : ""}
        ${list.length ? `<ol class="tl">${list.map((it, i) => stopRow(it, i, list.length, d.n, editMode)).join("")}</ol>` : `<div class="empty">這天還沒有地點。</div>`}
        ${add}
      </div></details>`;
  }).join("");
  return `<section class="sec" id="sec-days"><h2 class="sec-title">📅 每日行程</h2>${blocks}</section>`;
}

function wishSec() {
  const w = canWrite();
  const list = [...S.wishes].sort((a, b) => (b.votes?.length || 0) - (a.votes?.length || 0) || (a.createdAt || 0) - (b.createdAt || 0));
  const cards = list.map((x) => {
    const votes = x.votes || [];
    const mine = S.myId && votes.includes(S.myId);
    const armed = S.armed === x.id;
    return `<div class="card"><span style="font-weight:900">${KIND_ICON[x.kind] || "📍"} ${esc(x.title)}</span>
      ${x.note ? `<p class="note">${esc(x.note)}</p>` : ""}
      <span class="note" style="font-size:12px">${x.addedBy ? `由 ${esc(who(x.addedBy))} 提出` : ""}${votes.length ? `${x.addedBy ? "・" : ""}${votes.map(who).map(esc).join("、")} 想去` : ""}</span>
      <div class="actions"><a class="btn map" href="${esc(mapUrl(x.map || x.title))}" target="_blank" rel="noopener">📍 地圖</a>
        ${w && S.myId ? `<button class="btn vote ${mine ? "on" : ""}" data-act="vote" data-id="${x.id}" aria-pressed="${!!mine}">🙋 想去 ${votes.length}</button>` : `<span class="tag">想去 ${votes.length}</span>`}
        ${w ? `<span class="promote actions"><select id="p-${x.id}" aria-label="排進哪一天">${dayOptions(1)}</select><button class="btn" data-act="promote" data-id="${x.id}">排進行程</button></span>
        <button class="btn danger ${armed ? "armed" : ""}" data-act="wdel" data-id="${x.id}">${armed ? "再按一次刪除" : "刪除"}</button>` : ""}</div></div>`;
  }).join("");
  const f = S.draft;
  const add = !w ? "" : S.editing === "wish-new" ? `<form class="edit" data-form="new-wish">
      <div class="field"><label for="w-title">想去哪裡</label><input id="w-title" name="title" value="${esc(f.title)}" required placeholder="例如:環球影城"></div>
      <div class="field"><label for="w-note">為什麼想去</label><textarea id="w-note" name="note">${esc(f.note)}</textarea></div>
      <div class="row"><div class="field"><label for="w-kind">類型</label><select id="w-kind" name="kind">${kindOptions(f.kind || "景點")}</select></div>
        <div class="field"><label for="w-map">Google 地圖搜尋字或連結</label><input id="w-map" name="map" value="${esc(f.map)}"></div></div>
      <div class="actions"><button class="btn primary" type="submit">提出</button><button class="btn" type="button" data-act="cancel">取消</button></div></form>`
    : `<button class="btn add" data-act="wnew">+ 提出想去的地方</button>`;
  return `<section class="sec" id="sec-wish"><h2 class="sec-title">🗳️ 想去清單</h2>
    <p class="sec-note">還沒排進行程的地方先放這裡,大家投票後再排進某一天。</p>
    <div class="wish-list">${cards || `<div class="empty">還沒有人提案。</div>`}</div>${add}</section>`;
}

function tipsSec() {
  const list = [...S.prep].sort(byOrder);
  const mine = !!S.myId;
  const done = list.filter((p) => S.checks[p.id]).length;
  const pct = list.length ? Math.round((done / list.length) * 100) : 0;
  const rows = list.map((p) => {
    if (S.editing === "prep:" + p.id) return `<li>${specForm("prep-edit", PREP_SPECS, "儲存")}</li>`;
    const on = !!S.checks[p.id], armed = S.armed === p.id;
    return `<li class="check ${on ? "done" : ""}"><input type="checkbox" id="c-${p.id}" data-check="${p.id}" ${on ? "checked" : ""} ${mine ? "" : "disabled"}>
      <label class="txt" for="c-${p.id}"><span class="t1">${esc(p.text)}</span>${p.note ? `<span class="note">${esc(p.note)}</span>` : ""}</label>
      ${canWrite() ? `<span class="actions"><button class="btn ghost" data-act="pedit" data-id="${p.id}" aria-label="編輯">✏️</button>
        <button class="btn ghost danger ${armed ? "armed" : ""}" data-act="pdel" data-id="${p.id}" aria-label="刪除">${armed ? "確定" : "✕"}</button></span>` : ""}</li>`;
  }).join("");
  const add = !canWrite() ? "" : S.editing === "prep:new" ? specForm("prep-new", PREP_SPECS, "加入") : `<button class="btn add" data-act="pnew">+ 新增提醒</button>`;
  return `<section class="sec" id="sec-tips"><h2 class="sec-title">🧳 旅遊小提醒</h2>
    <details class="tips" ${S.tipsOpen ? "open" : ""} id="tips-d"><summary><span>點開查看:護照・日幣・網路・保暖${mine ? `(你完成 ${done}/${list.length})` : ""}</span><span class="tri" aria-hidden="true">▶</span></summary>
      <div class="tips-body">
        ${mine && list.length ? `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="準備進度"><i style="width:${pct}%"></i></div>
          <span class="note" style="font-size:12px">打勾只有你自己看得到。</span>` : ""}
        ${list.length ? `<ul class="check-list">${rows}</ul>` : `<div class="empty">還沒有提醒事項。</div>`}
        ${add}
      </div></details></section>`;
}

function render() {
  if (S.noDb) { $("main").innerHTML = `<div class="empty" style="margin-top:24px">行程存在共用資料庫裡。請登入 claude.ai 後開啟這個頁面。</div>`; return; }
  if (!S.ready) return;
  const keep = {};
  document.querySelectorAll(".hscroll").forEach((el) => (keep[el.id] = el.scrollLeft));
  $("main").innerHTML = flightsSec() + weatherSec() + spotsSec() + foodSec() + staySec() + daysSec() + wishSec() + tipsSec();
  for (const id in keep) { const el = $(id); if (el) el.scrollLeft = keep[id]; }
}

/* ---------- nav ---------- */
$("pills").addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  const el = $("sec-" + b.dataset.go); if (el) el.scrollIntoView({ block: "start" });
});
const spy = () => {
  let cur = null;
  document.querySelectorAll("section.sec").forEach((s) => { if (s.getBoundingClientRect().top < 140) cur = s.id.slice(4); });
  document.querySelectorAll(".pill").forEach((p) => p.classList.toggle("on", p.dataset.go === cur));
  const on = document.querySelector(".pill.on");
  if (on && on.dataset.go !== spy.last) { spy.last = on.dataset.go; on.scrollIntoView({ inline: "center", block: "nearest" }); }
};
window.addEventListener("scroll", () => requestAnimationFrame(spy), { passive: true });

/* ---------- interactions ---------- */
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (d.matches && d.matches("details.day")) { const n = Number(d.dataset.day); d.open ? S.open.add(n) : S.open.delete(n); }
  if (d.id === "tips-d") S.tipsOpen = d.open;
}, true);
document.addEventListener("input", (e) => {
  const f = e.target.closest("form.edit"); if (f && e.target.name) S.draft[e.target.name] = e.target.value;
});
let checkChain = Promise.resolve();
document.addEventListener("change", (e) => {
  const id = e.target.dataset && e.target.dataset.check;
  if (!id || !S.myId) return;
  const next = { ...S.checks };
  if (e.target.checked) next[id] = true; else delete next[id];
  S.checks = next; render();
  if (S.static) { try { localStorage.setItem("kansai-checks", JSON.stringify(next)); } catch (err) {} return; }
  if (!S.db) return;
  checkChain = checkChain.then(() => S.db.doc(`data/users/${S.myId}/state`).set({ checked: next }))
    .catch(() => toast("勾選沒有存到,請檢查網路後再試一次。"));
});
function pickDraft(obj, specs) { const d = {}; specs.forEach((s) => (d[s.n] = obj[s.n] ?? "")); return d; }

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (!["del", "wdel", "pdel"].includes(act)) S.armed = null;
  const it = S.items.find((i) => i.id === id);

  if (act === "cancel") { S.editing = null; S.draft = {}; render(); return; }
  if (act === "editday") { const n = Number(b.dataset.day); S.editDays.has(n) ? S.editDays.delete(n) : S.editDays.add(n); S.open.add(n); S.editing = null; render(); return; }
  if (act === "new") { const n = Number(b.dataset.day); S.editing = "new:" + n; S.draft = { day: n, kind: "景點" }; render(); $("f-title")?.focus(); return; }
  if (act === "wnew") { S.editing = "wish-new"; S.draft = { kind: "景點" }; render(); $("w-title")?.focus(); return; }
  if (act === "fedit") { const f = S.flights.find((x) => x.id === id); if (!f) return; S.editing = "flight:" + id; S.draft = pickDraft(f, FLIGHT_SPECS); render(); $("x-label")?.focus(); return; }
  if (act === "hedit") { const h = S.hotels.find((x) => x.id === id); if (!h) return; S.editing = "hotel:" + id; S.draft = pickDraft(h, HOTEL_SPECS); render(); $("x-city")?.focus(); return; }
  if (act === "pnew") { S.editing = "prep:new"; S.draft = {}; render(); $("x-text")?.focus(); return; }
  if (act === "pedit") { const p = S.prep.find((x) => x.id === id); if (!p) return; S.editing = "prep:" + id; S.draft = pickDraft(p, PREP_SPECS); render(); $("x-text")?.focus(); return; }
  if (act === "pdel") {
    const p = S.prep.find((x) => x.id === id); if (!p) return;
    if (S.armed !== id) { S.armed = id; render(); return; }
    S.armed = null; await write(() => S.db.collection("prep").doc(id).delete(), `已刪除「${p.text}」`); return;
  }
  if (act === "edit" && it) {
    S.editing = it.id; S.draft = { title: it.title, note: it.note || "", kind: it.kind || "景點", group: it.group || "", map: it.map || "", day: it.day };
    render(); $("f-title")?.focus(); return;
  }
  if ((act === "up" || act === "down") && it) {
    const list = itemsOf(it.day); const i = list.indexOf(it); const j = act === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    await write(async () => {
      for (let k = 0; k < list.length; k++) if (list[k].order !== k + 1) await S.db.collection("items").doc(list[k].id).update({ order: k + 1 });
    });
    return;
  }
  if (act === "del" && it) {
    if (S.armed !== it.id) { S.armed = it.id; render(); return; }
    S.armed = null; await write(() => S.db.collection("items").doc(it.id).delete(), `已刪除「${it.title}」`); return;
  }
  const wish = S.wishes.find((x) => x.id === id);
  if (act === "vote" && wish && S.myId) {
    const votes = wish.votes || [];
    const next = votes.includes(S.myId) ? votes.filter((v) => v !== S.myId) : [...votes, S.myId];
    await write(() => S.db.collection("wishlist").doc(wish.id).update({ votes: next })); return;
  }
  if (act === "wdel" && wish) {
    if (S.armed !== wish.id) { S.armed = wish.id; render(); return; }
    S.armed = null; await write(() => S.db.collection("wishlist").doc(wish.id).delete(), `已刪除「${wish.title}」`); return;
  }
  if (act === "promote" && wish) {
    const day = Number($("p-" + wish.id).value) || 1;
    const ok = await write(() => S.db.collection("items").add({
      day, order: maxOrder(day) + 1, title: wish.title, note: wish.note || "", kind: wish.kind || "景點", group: "",
      map: wish.map || "", addedBy: wish.addedBy || S.myId || null, createdAt: Date.now(),
    }));
    if (ok) await write(() => S.db.collection("wishlist").doc(wish.id).delete(), `「${wish.title}」已排進 Day ${day}`);
  }
});

document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form.edit"); if (!f) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries());
  for (const k in fd) fd[k] = String(fd[k]).trim();
  const form = f.dataset.form;
  let ok = false;
  if (form === "flight" || form === "hotel" || form === "prep-edit") {
    const [kind, docId] = S.editing.split(":");
    const coll = kind === "flight" ? "flights" : kind === "hotel" ? "hotels" : "prep";
    if (form === "prep-edit" && !fd.text) { toast("請先填待辦事項。"); return; }
    if (form === "flight") fd.leadMin = Number(fd.leadMin) || 150;
    ok = await write(() => S.db.collection(coll).doc(docId).update(fd), "已儲存");
  } else if (form === "prep-new") {
    if (!fd.text) { toast("請先填待辦事項。"); return; }
    const order = S.prep.reduce((m, p) => Math.max(m, p.order ?? 0), 0) + 1;
    ok = await write(() => S.db.collection("prep").add({ text: fd.text, note: fd.note || "", order, addedBy: S.myId || null }), "已加入提醒");
  } else {
    if (!fd.title) { toast("請先填地點名稱。"); return; }
    const base = { title: fd.title, note: fd.note || "", kind: fd.kind || "景點", map: fd.map || "" };
    if (form === "new-item") {
      const day = Number(fd.day) || 1;
      ok = await write(() => S.db.collection("items").add({ ...base, day, group: fd.group || "", order: maxOrder(day) + 1, addedBy: S.myId || null, createdAt: Date.now() }), `已加入 Day ${day}`);
    } else if (form === "edit-item") {
      const it = S.items.find((i) => i.id === S.editing); if (!it) return;
      const day = Number(fd.day) || it.day;
      const patch = { ...base, group: fd.group || "", day };
      if (day !== it.day) { patch.order = maxOrder(day) + 1; S.open.add(day); }
      ok = await write(() => S.db.collection("items").doc(it.id).update(patch), day !== it.day ? `已移到 Day ${day}` : "已儲存");
    } else if (form === "new-wish") {
      ok = await write(() => S.db.collection("wishlist").add({ ...base, votes: S.myId ? [S.myId] : [], addedBy: S.myId || null, createdAt: Date.now() }), "已加入想去清單");
    }
  }
  if (ok) { S.editing = null; S.draft = {}; S.pendingRender = false; render(); }
});

/* ---------- data ---------- */
async function resolveNames() {
  if (!S.user) return;
  const ids = [...new Set([...S.items.map((i) => i.addedBy), ...S.wishes.flatMap((w) => [w.addedBy, ...(w.votes || [])])].filter(Boolean))];
  if (!ids.length) return;
  const ps = await S.user.profiles(ids);
  let changed = false;
  for (const id of ids) { const nm = (ps[id] && ps[id].name) || ""; if (S.names[id] !== nm) { S.names[id] = nm; changed = true; } }
  if (changed) requestRender();
}

/* Read-only copy (e.g. GitHub Pages): data is embedded as window.EMBED, checks stay on this device */
function loadEmbed(E) {
  S.static = true; S.myId = "local"; S.writable = false;
  S.items = E.items || []; S.wishes = E.wishes || []; S.flights = E.flights || []; S.hotels = E.hotels || []; S.prep = E.prep || [];
  try { S.checks = JSON.parse(localStorage.getItem("kansai-checks") || "{}") || {}; } catch (e) { S.checks = {}; }
  $("foot").textContent = `唯讀版・資料更新於 ${E.updated || ""}`;
  S.ready = true; render();
}

(async () => {
  if (window.EMBED) { loadEmbed(window.EMBED); return; }
  const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  S.db = db; S.user = user;
  if (!db) { S.noDb = true; render(); return; }
  if (user) {
    S.myId = await user.id();
    if ((await user.can("data.write")) === false) S.writable = false;
  }
  const got = {};
  const onErr = () => toast("連線中斷,重新整理頁面就能恢復同步。");
  const sub = (coll, key) => db.collection(coll).onSnapshot((snap) => {
    S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    got[key] = true;
    S.ready = ["items", "wishes", "flights", "hotels", "prep"].every((k) => got[k]);
    requestRender();
    if (key === "items" || key === "wishes") resolveNames();
  }, onErr);
  sub("items", "items"); sub("wishlist", "wishes"); sub("flights", "flights"); sub("hotels", "hotels"); sub("prep", "prep");
  if (S.myId) {
    db.doc(`data/users/${S.myId}/state`).onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      S.checks = (d && d.checked) || {};
      requestRender();
    }, () => {});
  }
})();
</script>

</body></html>
